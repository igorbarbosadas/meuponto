<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Ponto · Diagnóstico de publicação</title><style>body{font:16px system-ui;background:#f2f5fa;color:#17345c;max-width:670px;margin:45px auto;padding:20px}main{background:white;border-radius:18px;padding:24px;box-shadow:0 6px 28px #11243b12}button{padding:12px 18px;background:#173c6c;color:white;border:0;border-radius:9px;cursor:pointer}p{line-height:1.5}.ok{color:#126b4c}.err{color:#b43d35}</style><main><h2>Diagnóstico da publicação</h2><p>Esta página só verifica a disponibilidade dos arquivos. Não lê nem mostra credenciais e não altera registros.</p><button id="run">Verificar arquivos</button><div id="result" aria-live="polite"></div><p>Se config.js estiver ausente, restaure o mesmo arquivo da publicação anterior na raiz do repositório, ao lado de index.html. Não cole credenciais em conversas.</p></main><script>document.getElementById('run').onclick=async()=>{const r=document.getElementById('result');r.textContent='Verificando...';const rows=[];for(const f of ['index.html','config.js','sw.js','version.json']){try{const resp=await fetch('./'+f+'?check='+Date.now(),{cache:'no-store'});rows.push({f,ok:resp.ok,status:resp.status})}catch(e){rows.push({f,ok:false,status:'erro de rede'})}}r.replaceChildren(...rows.map(x=>{const p=document.createElement('p');p.className=x.ok?'ok':'err';p.textContent=(x.ok?'Disponível: ':'Indisponível: ')+x.f+' ('+x.status+')';return p}))}</script></html>
